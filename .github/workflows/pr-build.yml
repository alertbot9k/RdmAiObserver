name: Build RdmAiObserver

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build decision and replay core
      run: dotnet build RdmAiObserver.Core.slnx --configuration Release
    - name: Run offline scenarios
      run: dotnet test RdmAiObserver.Core.slnx --configuration Release --no-build
    - name: Verify formatting and release metadata
      shell: pwsh
      run: ./scripts/verify-release.ps1 -SkipPluginBuild

  build:
    runs-on: windows-2022

    env:
      Solution_Name: SamplePlugin

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build SamplePlugin.slnx --configuration Release

    - name: Package release
      shell: pwsh
      run: ./scripts/package-release.ps1

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RdmAiObserver-${{ github.sha }}
        path: .\artifacts\RdmAiObserver-*.zip
        if-no-files-found: error
        retention-days: 1
